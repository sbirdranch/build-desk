<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build Desk — Model assets</title>
<link rel="icon" href="assets/branding/favicon.ico">
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui;background:#131c22;color:#edf1f4}*{box-sizing:border-box}body{margin:0}header{padding:14px 28px;border-bottom:1px solid #38434b;display:flex;align-items:center;gap:16px}header img{width:68px;height:68px}h1{font-size:24px;margin:0}h2{font-size:20px;margin:0 0 12px}.muted{color:#afbec9}main{display:grid;grid-template-columns:330px minmax(0,1fr);max-width:1600px;margin:auto}aside{padding:24px;border-right:1px solid #38434b}section{padding:28px}label{display:block}input,select,button{font:inherit;padding:10px;border:1px solid #5a6b76;border-radius:6px;background:#202d36;color:inherit}input,select{width:100%;margin:6px 0 14px}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #f7c52b}button[aria-pressed=true]{border-color:#f7c52b;color:#f7c52b}.item{display:flex;align-items:center;gap:12px;text-align:left;width:100%;margin:8px 0}.item img{width:62px;height:62px;object-fit:contain;border-radius:4px}.item span{overflow-wrap:anywhere}.small{font-size:13px}.viewer{position:relative;background:#182127;border-radius:8px;width:100%;aspect-ratio:1.45;min-height:260px}canvas{display:block;width:100%;height:100%}.preview{max-width:100%;width:100%;height:100%;object-fit:contain}#viewer-host{height:100%;position:absolute;inset:0}.toolbar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 24px}dt{color:#afbec9}dd{margin:0;overflow-wrap:anywhere}.warning{color:#f7c52b}#part-list{max-height:75vh;overflow:auto}#message{min-height:24px}.stats{margin-left:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;text-align:left;border-bottom:1px solid #38434b}@media(max-width:760px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #38434b}#part-list{max-height:260px}.stats{display:none}section{padding:18px}dl{grid-template-columns:1fr}dd{margin-bottom:10px}}
</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head>
<body><header><img src="assets/branding/build-desk-mark.svg" alt="Build Desk dump truck"><div><h1>Build Desk</h1><div class="muted">Real model asset review · Kitten 745</div></div><div id="stats" class="stats muted"></div></header>
<main><aside><label>Asset type<select id="kind"><option value="parts">Parts</option><option value="plates">Plates</option></select></label><label>Search<input id="search" type="search" placeholder="Name, section or stable ID"></label><div id="part-list"></div></aside>
<section><div class="muted small" id="breadcrumb"></div><h2 id="name">Loading assets…</h2><div class="viewer"><img id="preview" class="preview" alt=""><div id="viewer-host" hidden></div></div><div class="toolbar"><button id="still" aria-pressed="true">Image</button><button id="rotate" aria-pressed="false">Rotate model</button><button id="reset">Reset view</button></div><div id="message" role="status" aria-live="polite"></div><dl id="details"></dl><p class="muted small">Display assets only. Rotatable models are simplified for speed; use the original STL/3MF for printing. Saved plate thumbnails may predate file edits and require Bambu review.</p><div id="instances"></div></section></main>
<script type="module">
const $=id=>document.getElementById(id);let catalog, selected, viewer, revision=0;
const base='/assets/generated/';
function text(el,value){el.textContent=value}
function records(){return $('kind').value==='parts'?catalog.parts:catalog.projects.flatMap(p=>p.plates.map(a=>({...a,project:p.filename,section:p.section})));}
function list(){const q=$('search').value.toLowerCase();$('part-list').replaceChildren();for(const r of records().filter(x=>[x.name,x.section,x.id].join(' ').toLowerCase().includes(q))){const b=document.createElement('button');b.className='item';b.setAttribute('aria-pressed',String(selected?.id===r.id));const im=document.createElement('img');im.src=base+r.thumbnail;im.alt='';im.loading='lazy';const span=document.createElement('span');span.textContent=r.name;const small=document.createElement('div');small.className='small muted';small.textContent=r.id;span.append(small);b.append(im,span);b.onclick=()=>select(r);$('part-list').append(b);}}
function row(key,value){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=key;dd.textContent=value;$('details').append(dt,dd)}
function select(r){selected=r;revision++;viewer?.clear();$('viewer-host').hidden=true;$('preview').hidden=false;$('still').setAttribute('aria-pressed','true');$('rotate').setAttribute('aria-pressed','false');$('preview').src=base+r.preview;$('preview').alt=`Geometry preview of ${r.name}`;text($('name'),r.name);text($('breadcrumb'),r.section+' / '+(r.project||r.source_relative));text($('message'),'');$('details').replaceChildren();row('Stable ID',r.id);if(r.bounds_mm)row('Bounds (mm)',r.bounds_mm.join(' × '));row('Source triangles',r.source_faces?.toLocaleString()||'—');row('Display triangles',r.display_faces?.toLocaleString()||'—');if(r.tracking)row('Tracking',r.tracking==='tracked'?'Tracked plate':'Untracked preview candidate');if(r.preview_origin)row('Still image',r.preview_origin==='saved_3mf_thumbnail'?'Saved Bambu thumbnail (review freshness)':'Reconstructed geometry');if(r.slice_info)row('Slicing',r.slice_info.label);row('Source fingerprint',r.sha256||catalog.projects.find(p=>p.filename===r.project)?.sha256||'—');$('instances').replaceChildren();if(r.instances){const h=document.createElement('h2');h.textContent='Saved plate instances';$('instances').append(h);for(const i of r.instances){const p=document.createElement('p');p.textContent=`${i.enabled?'Enabled':'Disabled'} · ${i.name}`;$('instances').append(p);}}list();}
async function rotate(){if(!selected)return;const r=selected, rev=revision;try{if(!viewer){const THREE=await import('three');const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');const scene=new THREE.Scene();scene.background=new THREE.Color('#182127');const camera=new THREE.PerspectiveCamera(38,1,.01,100000);camera.up.set(0,0,1);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));$('viewer-host').append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xe8f3ff,0x4b4d43,2.3));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(-300,-400,600);scene.add(light);let model;function reset(){if(!model)return;const box=new THREE.Box3().setFromObject(model);const center=box.getCenter(new THREE.Vector3());const radius=box.getSize(new THREE.Vector3()).length()/2;controls.target.copy(center);camera.near=Math.max(radius/1000,.001);camera.far=Math.max(radius*100,1000);camera.position.copy(center).add(new THREE.Vector3(1.4,-1.8,1.2).normalize().multiplyScalar(radius/Math.sin(19*Math.PI/180)*1.15));camera.updateProjectionMatrix();controls.update();}function clear(){if(model){scene.remove(model);model.traverse(o=>{o.geometry?.dispose();if(o.material){for(const m of Array.isArray(o.material)?o.material:[o.material])m.dispose();}});model=null;}}new ResizeObserver(()=>{const w=$('viewer-host').clientWidth,h=$('viewer-host').clientHeight;if(w&&h){renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}}).observe($('viewer-host'));renderer.setAnimationLoop(()=>{if(!$('viewer-host').hidden){controls.update();renderer.render(scene,camera);}});viewer={clear,reset,load:async url=>{const gltf=await new GLTFLoader().loadAsync(url);return gltf.scene;},show:m=>{clear();model=m;scene.add(model);reset();}};}$('viewer-host').hidden=false;$('preview').hidden=true;text($('message'),'Loading rotatable geometry…');const m=await viewer.load(base+r.model);if(rev!==revision){m.traverse(o=>o.geometry?.dispose());return;}viewer.show(m);$('still').setAttribute('aria-pressed','false');$('rotate').setAttribute('aria-pressed','true');text($('message'),'Drag to rotate · Wheel to zoom · Right-drag to pan');}catch(e){$('viewer-host').hidden=true;$('preview').hidden=false;text($('message'),'3D preview unavailable. The still image remains available. '+e.message);}}
$('rotate').onclick=rotate;$('still').onclick=()=>{revision++;$('viewer-host').hidden=true;$('preview').hidden=false;$('still').setAttribute('aria-pressed','true');$('rotate').setAttribute('aria-pressed','false');text($('message'),'');};$('reset').onclick=()=>viewer?.reset();$('search').oninput=list;$('kind').onchange=()=>{const r=records()[0];if(r)select(r);else list();};try{const res=await fetch(base+'catalog.json');if(!res.ok)throw new Error('Generate assets first');catalog=await res.json();text($('stats'),`${catalog.parts.length} parts · ${catalog.projects.reduce((n,p)=>n+p.plates.length,0)} plates`);select(records()[0]);}catch(e){text($('name'),'Assets unavailable');text($('message'),e.message);}
</script></body></html>
